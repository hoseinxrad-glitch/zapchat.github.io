services:
  - type: web
    name: zapchat-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: render-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
