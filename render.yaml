databases:
  - name: zapchat-database
    region: oregon
    plan: free
    ipAllowList: []
    postgresMajorVersion: 16

services:
  # Next.js Web Service
  - type: web
    name: zapchat-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: zapchat-database
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://zapchat-socket.onrender.com
      - key: UPLOAD_DIR
        value: /data/uploads

  # WebSocket Service
  - type: web
    name: zapchat-socket
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: render-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
