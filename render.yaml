# Render Blueprint for ZapChat
# This file defines all the services needed to run ZapChat in production.
# Deploy this on https://render.com — sign up free, then "New Blueprint" pointing to your repo.

services:
  # ============================================================
  # PostgreSQL Database (free for 90 days, then $7/mo)
  # ============================================================
  - type: pserv
    name: zapchat-database
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.db
    envVars:
      - key: POSTGRES_USER
        value: zapchat
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: zapchat
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata

  # ============================================================
  # Main Next.js Web Service (frontend + API + auth + chat)
  # Free tier: sleeps after 15min of inactivity, 750h/month
  # ============================================================
  - type: web
    name: zapchat-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: zapchat-database
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://zapchat-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://zapchat-web.onrender.com
      - key: UPLOAD_DIR
        value: /data/uploads

  # ============================================================
  # WebSocket Service (real-time messaging)
  # Separate service so it can scale independently if needed
  # ============================================================
  - type: web
    name: zapchat-socket
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: render-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
